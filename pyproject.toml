[project]
name = "swarm-lab"
version = "0.1.0"
description = "Tiny FastAPI service used to exercise the swarm-bots fleet end-to-end."
requires-python = ">=3.12"
dependencies = [
    # Intentionally pinned to mid-versions so Dependabot has something to bump.
    "fastapi==0.138.2",
    "uvicorn==0.30.0",
    "httpx==0.27.0",
    "pydantic==2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.0",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
